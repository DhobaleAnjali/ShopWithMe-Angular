<section class="register-container">
  <div class="register-card">

    <h2>Create Account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form">

      <div class="form-grid">

        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter full name"
          />

          <app-form-error [control]="form.get('name')"></app-form-error>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter email"
          />

          <small
            class="error-text"
            *ngIf="
              form.get('email')?.invalid &&
              (form.get('email')?.dirty || form.get('email')?.touched)
            "
          >
            Please enter a valid email
          </small>
        </div>

        <!-- Primary Mobile -->
        <div class="form-group">
          <label>Primary Mobile</label>

          <input
            type="text"
            class="form-control"
            formControlName="mobilePrimary"
            placeholder="Enter mobile number"
          />

          <app-form-error [control]="form.get('mobilePrimary')"></app-form-error>
        </div>

        <!-- Secondary Mobile -->
        <div class="form-group">
          <label>Secondary Mobile (Optional)</label>

          <input
            type="text"
            class="form-control"
            formControlName="mobileSecondary"
            placeholder="Enter secondary mobile"
          />

          <app-form-error [control]="form.get('mobileSecondary')"></app-form-error>
        </div>

        <!-- Address -->
        <div class="form-group address-field">
          <label>Address</label>

          <textarea
            class="form-control textarea"
            rows="4"
            formControlName="address"
            placeholder="Enter address"
          ></textarea>

          <app-form-error [control]="form.get('address')"></app-form-error>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>

          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
          />

          <app-form-error [control]="form.get('password')"></app-form-error>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label>Confirm Password</label>

          <input
            type="password"
            class="form-control"
            formControlName="confirmPassword"
            placeholder="Confirm password"
          />

          <app-form-error [control]="form.get('confirmPassword')"></app-form-error>

          <small
            class="error-text"
            *ngIf="form.hasError('passwordMismatch')"
          >
            Passwords do not match
          </small>
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="row-buttons">

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="form.invalid"
        >
          Register
        </button>

        <button
          type="button"
          class="btn btn-secondary"
        >
          Cancel
        </button>

      </div>

      <!-- LOGIN -->
      <p class="login-link">
        Already have an account?

        <a class="link" routerLink="/login">
          Login here
        </a>
      </p>

    </form>

  </div>
</section>
